[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rmfdn-ablation"
version = "1.0.0"
description = "R-MFDN modality x reference ablation on IDForge_v2"
requires-python = ">=3.9"
dependencies = [
  "torch",
  "torchaudio",
  "timm",
  "transformers",
  "scikit-learn",
  "numpy",
  "opencv-python",
]

[tool.setuptools.packages.find]
include = ["rmfdn_ablation*"]
